<!DOCTYPE html>
<html lang="om">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>Walo-OR - Attendance</title>

<style>

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family:
    Arial,
    Helvetica,
    sans-serif;

  background: #f4f7f5;
  color: #17231c;
}

header {
  background: #087443;
  color: white;
  padding: 18px;
}

.header-inner {
  width: min(1150px, 94%);
  margin: auto;

  display: flex;
  justify-content: space-between;
  align-items: center;

  gap: 15px;
}

.logo {
  font-size: 23px;
  font-weight: bold;
}

.header-right {
  display: flex;
  align-items: center;
  gap: 10px;
}

.container {
  width: min(1150px, 94%);
  margin: 22px auto;
}

.card {
  background: white;
  border-radius: 18px;
  padding: 20px;
  margin-bottom: 18px;

  box-shadow:
    0 5px 18px rgba(0,0,0,.07);
}

.card h2 {
  color: #087443;
  margin-top: 0;
}

.grid {
  display: grid;

  grid-template-columns:
    repeat(
      auto-fit,
      minmax(180px, 1fr)
    );

  gap: 14px;
}

.stat {
  background: #eef8f2;
  padding: 18px;
  border-radius: 15px;
  text-align: center;
}

.stat strong {
  display: block;
  font-size: 27px;
  color: #087443;
  margin-top: 6px;
}

input,
select,
button,
textarea {
  width: 100%;
  padding: 12px;

  border-radius: 10px;
  border: 1px solid #d4ddd7;

  font-size: 15px;
}

textarea {
  min-height: 80px;
  resize: vertical;
}

button {
  background: #087443;
  color: white;
  border: none;
  cursor: pointer;
  font-weight: bold;
}

button:hover {
  opacity: .9;
}

button.danger {
  background: #c62828;
}

button.secondary {
  background: #555;
}

button.warning {
  background: #c47a00;
}

.form-grid {
  display: grid;

  grid-template-columns:
    repeat(
      auto-fit,
      minmax(180px, 1fr)
    );

  gap: 12px;
}

label {
  display: block;
  font-weight: bold;
  margin-bottom: 6px;
}

.form-item {
  margin-bottom: 12px;
}

.table-wrap {
  width: 100%;
  overflow-x: auto;
}

table {
  width: 100%;
  min-width: 850px;
  border-collapse: collapse;
}

th,
td {
  padding: 11px;
  border-bottom:
    1px solid #e5e5e5;

  text-align: left;
}

th {
  background: #087443;
  color: white;
}

.actions {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
}

.actions button {
  width: auto;
  padding: 8px 11px;
}

.link-box {
  background: #eef8f2;
  padding: 10px;
  border-radius: 10px;
  word-break: break-all;
  color: #087443;
  font-size: 13px;
  margin-bottom: 7px;
}

.hidden {
  display: none !important;
}

.message {
  padding: 12px;
  border-radius: 10px;
  margin-bottom: 15px;
  background: #eef8f2;
  color: #087443;
}

.error {
  padding: 12px;
  border-radius: 10px;
  margin-bottom: 15px;
  background: #ffebee;
  color: #c62828;
}

.auth {
  max-width: 450px;
  margin: 50px auto;
}

.auth h1 {
  text-align: center;
  color: #087443;
}

.auth-tabs {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 7px;
  margin-bottom: 18px;
}

.auth-tabs button {
  background: #ddd;
  color: #222;
}

.auth-tabs button.active {
  background: #087443;
  color: white;
}

.small {
  font-size: 13px;
  color: #666;
}

.status-present {
  color: #087443;
  font-weight: bold;
}

.status-absent {
  color: #c62828;
  font-weight: bold;
}

.status-late {
  color: #c47a00;
  font-weight: bold;
}

footer {
  text-align: center;
  color: #777;
  padding: 25px;
}

@media(max-width:600px) {

  .header-inner {
    flex-direction: column;
    align-items: flex-start;
  }

  .card {
    padding: 15px;
  }

}

</style>

</head>

AUTH

Sirna Attendance fi Bu'aa

<div class="auth-tabs">

<!-- =====================================================
CLASS

<script>

let token =
  localStorage.getItem(
    "walo_or_token"
  );

let classes = [];
let students = [];


/* =====================================================
HELPER
===================================================== */

function escapeHtml(value) {

  return String(value ?? "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");
}


async function api(
  url,
  options = {}
) {

  options.headers =
    options.headers || {};

  options.headers[
    "Content-Type"
  ] =
    "application/json";

  if (token) {

    options.headers[
      "Authorization"
    ] =
      `Bearer ${token}`;
  }

  const response =
    await fetch(
      url,
      options
    );

  let data = {};

  try {
    data =
      await response.json();
  } catch (e) {}

  if (
    response.status === 401
  ) {

    logout();

    throw new Error(
      "Login kee yeroon isaa darbeera."
    );
  }

  if (!response.ok) {

    throw new Error(
      data.error ||
      "Request hin milkoofne."
    );
  }

  return data;
}


function message(
  text,
  error = false
) {

  const box =
    document.getElementById(
      "globalMessage"
    );

  box.innerHTML = `
    <div class="${
      error
        ? "error"
        : "message"
    }">
      ${escapeHtml(text)}
    </div>
  `;

  setTimeout(() => {
    box.innerHTML = "";
  }, 4000);
}


/* =====================================================
AUTH TABS
===================================================== */

function showLogin() {

  document
    .getElementById(
      "loginForm"
    )
    .classList
    .remove("hidden");

  document
    .getElementById(
      "registerForm"
    )
    .classList
    .add("hidden");

  document
    .getElementById(
      "loginTab"
    )
    .classList
    .add("active");

  document
    .getElementById(
      "registerTab"
    )
    .classList
    .remove("active");
}


function showRegister() {

  document
    .getElementById(
      "loginForm"
    )
    .classList
    .add("hidden");

  document
    .getElementById(
      "registerForm"
    )
    .classList
    .remove("hidden");

  document
    .getElementById(
      "loginTab"
    )
    .classList
    .remove("active");

  document
    .getElementById(
      "registerTab"
    )
    .classList
    .add("active");
}


/* =====================================================
REGISTER
===================================================== */

async function register(event) {

  event.preventDefault();

  const box =
    document.getElementById(
      "authMessage"
    );

  try {

    const data =
      await api(
        "/api/register",
        {
          method: "POST",

          body:
            JSON.stringify({

              name:
                document
                  .getElementById(
                    "registerName"
                  )
                  .value,

              email:
                document
                  .getElementById(
                    "registerEmail"
                  )
                  .value,

              password:
                document
                  .getElementById(
                    "registerPassword"
                  )
                  .value

            })
        }
      );

    token =
      data.token;

    localStorage.setItem(
      "walo_or_token",
      token
    );

    startApp(
      data.user
    );

  } catch (error) {

    box.innerHTML = `
      <div class="error">
        ${escapeHtml(
          error.message
        )}
      </div>
    `;
  }
}


/* =====================================================
LOGIN
===================================================== */

async function login(event) {

  event.preventDefault();

  const box =
    document.getElementById(
      "authMessage"
    );

  try {

    const data =
      await api(
        "/api/login",
        {
          method: "POST",

          body:
            JSON.stringify({

              email:
                document
                  .getElementById(
                    "loginEmail"
                  )
                  .value,

              password:
                document
                  .getElementById(
                    "loginPassword"
                  )
                  .value

            })
        }
      );

    token =
      data.token;

    localStorage.setItem(
      "walo_or_token",
      token
    );

    startApp(
      data.user
    );

  } catch (error) {

    box.innerHTML = `
      <div class="error">
        ${escapeHtml(
          error.message
        )}
      </div>
    `;
  }
}


/* =====================================================
LOGOUT
===================================================== */

function logout() {

  token = null;

  localStorage.removeItem(
    "walo_or_token"
  );

  document
    .getElementById(
      "appSection"
    )
    .classList
    .add("hidden");

  document
    .getElementById(
      "authSection"
    )
    .classList
    .remove("hidden");

  document
    .getElementById(
      "userArea"
    )
    .classList
    .add("hidden");
}


/* =====================================================
START APP
===================================================== */

async function startApp(user) {

  document
    .getElementById(
      "authSection"
    )
    .classList
    .add("hidden");

  document
    .getElementById(
      "appSection"
    )
    .classList
    .remove("hidden");

  document
    .getElementById(
      "userArea"
    )
    .classList
    .remove("hidden");

  document
    .getElementById(
      "teacherName"
    )
    .textContent =
      user?.name || "";

  setToday();

  await loadAll();
}


/* =====================================================
LOAD ALL
===================================================== */

async function loadAll() {

  try {

    await loadDashboard();

    await loadClasses();

    await loadStudents();

    await loadResults();

    await loadReport();

  } catch (error) {

    message(
      error.message,
      true
    );
  }
}


/* =====================================================
DASHBOARD
===================================================== */

async function loadDashboard() {

  const data =
    await api(
      "/api/dashboard"
    );

  document
    .getElementById(
      "countClasses"
    )
    .textContent =
      data.classes;

  document
    .getElementById(
      "countStudents"
    )
    .textContent =
      data.students;

  document
    .getElementById(
      "countAttendance"
    )
    .textContent =
      data.attendance;

  document
    .getElementById(
      "countResults"
    )
    .textContent =
      data.results;
}


/* =====================================================
CLASS
===================================================== */

async function loadClasses() {

  classes =
    await api(
      "/api/classes"
    );

  renderClasses();
  fillClassSelects();
}


function renderClasses() {

  const box =
    document.getElementById(
      "classList"
    );

  if (!classes.length) {

    box.innerHTML = `
      <div class="message">
        Kutaan ammaaf hin jiru.
      </div>
    `;

    return;
  }

  box.innerHTML = `
    <table>

      <thead>

        <tr>
          <th>Kutaa</th>
          <th>Sadarkaa</th>
          <th>Barattoota</th>
          <th>Gocha</th>
        </tr>

      </thead>

      <tbody>

        ${classes.map(c => `

          <tr>

            <td>
              ${escapeHtml(c.name)}
            </td>

            <td>
              ${escapeHtml(c.grade || "-")}
            </td>

            <td>
              ${c.student_count}
            </td>

            <td>

              <button
                style="width:auto"
                class="danger"
                onclick="deleteClass(${c.id})"
              >
                Haqi
              </button>

            </td>

          </tr>

        `).join("")}

      </tbody>

    </table>
  `;
}


function fillClassSelects() {

  const ids = [
    "studentClassInput",
    "attendanceClass",
    "reportClass"
  ];

  ids.forEach(id => {

    const select =
      document.getElementById(id);

    if (!select) return;

    const current =
      select.value;

    const first =
      id === "reportClass"
        ? "Kutaa hunda"
        : "Kutaa filadhu";

    select.innerHTML = `
      <option value="">
        ${first}
      </option>

      ${classes.map(c => `
        <option value="${c.id}">
          ${escapeHtml(c.name)}
          ${c.grade
            ? " - " +
              escapeHtml(c.grade)
            : ""}
        </option>
      `).join("")}
    `;

    if (current) {
      select.value =
        current;
    }
  });
}


async function createClass(event) {

  event.preventDefault();

  try {

    await api(
      "/api/classes",
      {
        method: "POST",

        body:
          JSON.stringify({

            name:
              document
                .getElementById(
                  "className"
                )
                .value,

            grade:
              document
                .getElementById(
                  "classGrade"
                )
                .value

          })
      }
    );

    document
      .getElementById(
        "className"
      )
      .value = "";

    document
      .getElementById(
        "classGrade"
      )
      .value = "";

    message(
      "Kutaan uumameera."
    );

    await loadClasses();
    await loadDashboard();

  } catch (error) {

    message(
      error.message,
      true
    );
  }
}


async function deleteClass(id) {

  if (
    !confirm(
      "Kutaa kana haquu barbaaddaa?"
    )
  ) {
    return;
  }

  try {

    await api(
      `/api/classes/${id}`,
      {
        method: "DELETE"
      }
    );

    message(
      "Kutaan haqameera."
    );

    await loadClasses();
    await loadStudents();
    await loadDashboard();

  } catch (error) {

    message(
      error.message,
      true
    );
  }
}


/* =====================================================
STUDENT
===================================================== */

async function loadStudents() {

  students =
    await api(
      "/api/students"
    );

  renderStudents();
}


function renderStudents() {

  const box =
    document.getElementById(
      "studentsTable"
    );

  if (!students.length) {

    box.innerHTML = `
      <div class="message">
        Barataan ammaaf hin jiru.
      </div>
    `;

    return;
  }

  box.innerHTML = `
    <table>

      <thead>

        <tr>

          <th>Maqaa</th>

          <th>Code</th>

          <th>Kutaa</th>

          <th>Private Link</th>

          <th>Gocha</th>

        </tr>

      </thead>

      <tbody>

        ${students.map(s => {

          const link =
            s.private_link || "";

          return `

            <tr>

              <td>
                ${escapeHtml(
                  s.full_name
                )}
              </td>

              <td>
                ${escapeHtml(
                  s.student_code
                )}
              </td>

              <td>
                ${escapeHtml(
                  s.class_name || "-"
                )}
              </td>

              <td>

                ${
                  link
                    ? `
                      <div class="link-box">
                        ${escapeHtml(link)}
                      </div>

                      <div class="actions">

                        <button
                          onclick='copyLink(${JSON.stringify(link)})'
                        >
                          📋 Copy
                        </button>

                        <button
                          onclick='shareLink(
                            ${JSON.stringify(
                              link
                            )},
                            ${JSON.stringify(
                              s.full_name
                            )}

/* =====================================================
COPY LINK
===================================================== */

async function copyLink(link) {

  try {

    await navigator.clipboard.writeText(
      link
    );

    message(
      "Private Link copy godhameera."
    );

  } catch (error) {

    const input =
      document.createElement(
        "textarea"
      );

    input.value =
      link;

    document.body.appendChild(
      input
    );

    input.select();

    document.execCommand(
      "copy"
    );

    input.remove();

    message(
      "Private Link copy godhameera."
    );
  }
}


/* =====================================================
SHARE
===================================================== */

async function shareLink(
  link,
  studentName
) {

  const text =
    `🎓 Walo-OR\n\n` +
    `Linkii Attendance fi Bu'aa ` +
    `Qormaataa ${studentName}:\n\n` +
    link;

  if (
    navigator.share
  ) {

    try {

      await navigator.share({
        title:
          "Walo-OR",
        text:
          text,
        url:
          link
      });

      return;

    } catch (error) {}
  }

  await copyLink(link);

  alert(
    "Share option hin jirre. Linkiin copy godhameera."
  );
}

function setToday() {

  const now =
    new Date();

  const local =
    new Date(
      now.getTime() -
      now.getTimezoneOffset() * 60000
    );

  const date =
    local
      .toISOString()
      .slice(0, 10);

  document
    .getElementById(
      "attendanceDate"
    )
    .value = date;

  document
    .getElementById(
      "resultDate"
    )
    .value = date;
}


async function loadAttendance() {

  const classId =
    document
      .getElementById(
        "attendanceClass"
      )
      .value;

  const date =
    document
      .getElementById(
        "attendanceDate"
      )
      .value;

  if (!classId || !date) {

    document
      .getElementById(
        "attendanceTable"
      )
      .innerHTML = "";

    return;
  }

  try {

    const rows =
      await api(
        `/api/attendance?classId=${encodeURIComponent(classId)}&date=${encodeURIComponent(date)}`
      );

    renderAttendance(
      rows
    );

  } catch (error) {

    message(
      error.message,
      true
    );
  }
}


function renderAttendance(rows) {

  const box =
    document.getElementById(
      "attendanceTable"
    );

  if (!rows.length) {

    box.innerHTML = `
      <div class="message">
        Barataan kutaa kana keessa hin jiru.
      </div>
    `;

    return;
  }

  box.innerHTML = `
    <table>

      <thead>

        <tr>

          <th>Barataa</th>

          <th>Code</th>

          <th>Status</th>

          <th>Yaada</th>

          <th>Kuusi</th>

        </tr>

      </thead>

      <tbody>

        ${rows.map(row => `

          <tr>

            <td>
              ${escapeHtml(
                row.full_name
              )}
            </td>

            <td>
              ${escapeHtml(
                row.student_code
              )}
            </td>

            <td>

              <select
                id="status-${row.id}"
              >

                <option
                  value="present"
                  ${
                    row.status ===
                    "present"
                      ? "selected"
                      : ""
                  }
                >
                  🟢 Present
                </option>

                <option
                  value="absent"
                  ${
                    row.status ===
                    "absent"
                      ? "selected"
                      : ""
                  }
                >
                  🔴 Absent
                </option>

                <option
                  value="late"
                  ${
                    row.status ===
                    "late"
                      ? "selected"
                      : ""
                  }
                >
                  🟡 Late
                </option>

              </select>

            </td>

            <td>

              <input
                id="note-${row.id}"
                value="${escapeHtml(
                  row.note || ""
                )}"
                placeholder="Yaada..."
              >

            </td>

            <td>

              <button
                style="width:auto"
                onclick="saveAttendance(${row.id})"
              >
                Kuusi
              </button>

            </td>

          </tr>

        `).join("")}

      </tbody>

    </table>
  `;
}

async function loadResults() {

  if (!rows.length) {

    box.innerHTML = `

        Bu'aan ammaaf hin jiru.
      </div>
    `;

    return;
  }

  box.innerHTML = `
    <table>

      <thead>

        <tr>

          <th>Barataa</th>
          <th>Qormaata</th>
          <th>Mata-duree</th>

          <th>%</th>
          <th>Guyyaa</th>
          <th>Gocha</th>

        </tr>

      </thead>

      <tbody>

        ${rows.map(row => {

          const score =
            Number(row.score);

            total > 0

          return `

            <tr>

                )}

                  row.subject || "-"

              </td>

              <td>
                ${escapeHtml(
                  row.exam_date || "-"
                )}

              <td>

                <button
                  class="danger"

                  Haqi
