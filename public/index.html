<!DOCTYPE html>
<html lang="om">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Walo-OR - Barataa</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: #f4f7f5;
      color: #17231c;
    }

    .header {
      background: #087443;
      color: white;
      padding: 18px;
      text-align: center;
    }

    .header h1 {
      margin: 0;
      font-size: 22px;
    }

    .header p {
      margin: 7px 0 0;
      opacity: .9;
    }

    .container {
      width: min(1000px, 94%);
      margin: 20px auto;
    }

    .profile,
    .card {
      background: white;
      border-radius: 16px;
      padding: 20px;
      margin-bottom: 18px;
      box-shadow: 0 4px 15px rgba(0,0,0,.07);
    }

    .profile h2,
    .card h2 {
      margin-top: 0;
      color: #087443;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(
        auto-fit,
        minmax(160px, 1fr)
      );
      gap: 12px;
    }

    .stat {
      background: #eef8f2;
      border-radius: 14px;
      padding: 16px;
      text-align: center;
    }

    .stat strong {
      display: block;
      font-size: 25px;
      color: #087443;
      margin-top: 5px;
    }

    .code {
      display: inline-block;
      background: #eef8f2;
      color: #087443;
      padding: 6px 10px;
      border-radius: 8px;
      font-weight: bold;
    }

    .table-wrap {
      width: 100%;
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 500px;
    }

    th,
    td {
      padding: 12px;
      border-bottom: 1px solid #e5e5e5;
      text-align: left;
    }

    th {
      background: #087443;
      color: white;
    }

    .present {
      color: #087443;
      font-weight: bold;
    }

    .absent {
      color: #c62828;
      font-weight: bold;
    }

    .late {
      color: #c47a00;
      font-weight: bold;
    }

    .result-good {
      color: #087443;
      font-weight: bold;
    }

    .loading {
      text-align: center;
      padding: 50px 15px;
      font-size: 18px;
    }

    .error {
      max-width: 600px;
      margin: 60px auto;
      background: white;
      padding: 30px;
      border-radius: 16px;
      text-align: center;
      box-shadow: 0 4px 20px rgba(0,0,0,.08);
    }

    .error h2 {
      color: #c62828;
    }

    .footer {
      text-align: center;
      color: #777;
      padding: 25px;
    }

    .success {
      background: #eef8f2;
      border-left: 5px solid #087443;
      padding: 12px;
      border-radius: 8px;
      margin-bottom: 15px;
    }
  </style>
</head>

<body>

<header class="header">
  <h1>🎓 Walo-OR</h1>
  <p>Attendance fi Bu'aa Qormaataa</p>
</header>

<main class="container">

  <div id="loading" class="loading">
    ⏳ Odeeffannoo kee fe'aa jira...
  </div>

  <div
    id="errorBox"
    class="error"
    style="display:none;"
  ></div>

  <div
    id="content"
    style="display:none;"
  >

    <!-- PROFILE -->
    <section class="profile">

      <h2 id="studentName">
        👤 Barataa
      </h2>

      <p>
        Koodii:
        <span
          id="studentCode"
          class="code"
        ></span>
      </p>

      <p>
        Kutaa:
        <strong id="className"></strong>
      </p>

      <p>
        Sadarkaa:
        <strong id="grade"></strong>
      </p>

    </section>


    <!-- ATTENDANCE SUMMARY -->
    <section class="card">

      <h2>📅 Attendance Koo</h2>

      <div class="grid">

        <div class="stat">
          Guutuu
          <strong id="attTotal">0</strong>
        </div>

        <div class="stat">
          🟢 Present
          <strong id="attPresent">0</strong>
        </div>

        <div class="stat">
          🔴 Absent
          <strong id="attAbsent">0</strong>
        </div>

        <div class="stat">
          🟡 Late
          <strong id="attLate">0</strong>
        </div>

      </div>

    </section>


    <!-- ATTENDANCE -->
    <section class="card">

      <h2>📋 Galmee Attendance</h2>

      <div
        id="attendanceTable"
        class="table-wrap"
      ></div>

    </section>


    <!-- RESULTS -->
    <section class="card">

      <h2>🏆 Bu'aa Qormaataa Koo</h2>

      <div
        id="resultsTable"
        class="table-wrap"
      ></div>

    </section>

  </div>

</main>

<footer class="footer">
  © 2026 Walo-OR
</footer>


<script>

function escapeHtml(value) {

  return String(value ?? "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");

}


/*
  TOKEN BARBAADAA
  Fakkeenya:
  /s/8fK29xPqLm

  Akkasumas:
  /s/8fK29xPqLm/
  /s/8fK29xPqLm?x=1
  ni fudhata.
*/

function getToken() {

  const url =
    new URL(window.location.href);

  const path =
    url.pathname;

  const match =
    path.match(/\/s\/([^\/?#]+)/i);

  if (
    match &&
    match[1]
  ) {
    return decodeURIComponent(
      match[1]
    );
  }

  /*
    Yoo token query keessatti jiraate:
    ?token=xxxxxxxx
  */

  const queryToken =
    url.searchParams.get("token");

  if (queryToken) {
    return queryToken;
  }

  return "";
}


function formatDate(date) {

  if (!date) {
    return "-";
  }

  const d =
    new Date(date);

  if (isNaN(d.getTime())) {
    return escapeHtml(date);
  }

  return d.toLocaleDateString(
    "om-ET"
  );
}


function statusText(status) {

  if (status === "present") {
    return "🟢 Present";
  }

  if (status === "absent") {
    return "🔴 Absent";
  }

  if (status === "late") {
    return "🟡 Late";
  }

  return "-";
}


function statusClass(status) {

  if (
    [
      "present",
      "absent",
      "late"
    ].includes(status)
  ) {
    return status;
  }

  return "";
}


/*
  STUDENT DATA LOAD
*/

async function loadStudent() {

  const token =
    getToken();

  console.log(
    "Private student token:",
    token
  );

  if (!token) {

    showError(
      "Linkii dhuunfaa barataa hin argamne."
    );

    return;
  }

  try {

    const response =
      await fetch(
        `/api/public/student/${encodeURIComponent(token)}`,
        {
          method: "GET",
          headers: {
            "Accept": "application/json"
          }
        }
      );

    let data;

    try {
      data =
        await response.json();
    } catch (jsonError) {

      throw new Error(
        "Server irraa deebiin sirrii hin dhufne."
      );
    }


    if (!response.ok) {

      throw new Error(
        data.error ||
        "Odeeffannoo barataa argachuu hin dandeenye."
      );
    }


    if (!data.student) {

      throw new Error(
        "Barataan linkii kanaan hin argamne."
      );
    }


    showStudent(data);

  } catch (error) {

    console.error(
      "Student load error:",
      error
    );

    showError(
      error.message ||
      "Rakkoon uumameera."
    );
  }
}


/*
  SHOW STUDENT
*/

function showStudent(data) {

  const student =
    data.student || {};

  const attendance =
    Array.isArray(data.attendance)
      ? data.attendance
      : [];

  const summary =
    data.attendanceSummary || {};

  const results =
    Array.isArray(data.results)
      ? data.results
      : [];


  document.getElementById(
    "studentName"
  ).textContent =
    `👤 ${student.full_name || "Barataa"}`;


  document.getElementById(
    "studentCode"
  ).textContent =
    student.student_code || "-";


  document.getElementById(
    "className"
  ).textContent =
    student.class_name || "-";


  document.getElementById(
    "grade"
  ).textContent =
    student.grade || "-";


  document.getElementById(
    "attTotal"
  ).textContent =
    Number(summary.total || 0);


  document.getElementById(
    "attPresent"
  ).textContent =
    Number(summary.present || 0);


  document.getElementById(
    "attAbsent"
  ).textContent =
    Number(summary.absent || 0);


  document.getElementById(
    "attLate"
  ).textContent =
    Number(summary.late || 0);


  renderAttendance(
    attendance
  );


  renderResults(
    results
  );


  document.getElementById(
    "loading"
  ).style.display = "none";


  document.getElementById(
    "content"
  ).style.display = "block";

}


/*
  ATTENDANCE TABLE
*/

function renderAttendance(rows) {

  const box =
    document.getElementById(
      "attendanceTable"
    );


  if (!rows.length) {

    box.innerHTML = `
      <div class="success">
        📭 Attendance galmaa'ame
        hin jiru.
      </div>
    `;

    return;
  }


  box.innerHTML = `
    <table>

      <thead>

        <tr>
          <th>Guyyaa</th>
          <th>Haala</th>
          <th>Yaada</th>
        </tr>

      </thead>

      <tbody>

        ${rows.map(row => `

          <tr>

            <td>
              ${formatDate(
                row.attendance_date
              )}
            </td>

            <td class="${statusClass(
              row.status
            )}">
              ${statusText(
                row.status
              )}
            </td>

            <td>
              ${escapeHtml(
                row.note || "-"
              )}
            </td>

          </tr>

        `).join("")}

      </tbody>

    </table>
  `;
}


/*
  RESULT TABLE
*/

function renderResults(rows) {

  const box =
    document.getElementById(
      "resultsTable"
    );


  if (!rows.length) {

    box.innerHTML = `
      <div class="success">
        📭 Bu'aan qormaataa
        ammaaf hin galmoofne.
      </div>
    `;

    return;
  }


  box.innerHTML = `
    <table>

      <thead>

        <tr>
          <th>Guyyaa</th>
          <th>Qormaata</th>
          <th>Mata-duree</th>
          <th>Qabxii</th>
          <th>%</th>
        </tr>

      </thead>

      <tbody>

        ${rows.map(row => {

          const score =
            Number(row.score || 0);

          const total =
            Number(row.total || 100);

          let percentage;

          if (
            row.percentage !== undefined &&
            row.percentage !== null
          ) {

            percentage =
              Number(row.percentage);

          } else if (total > 0) {

            percentage =
              (score / total) * 100;

          } else {

            percentage = 0;

          }


          return `

            <tr>

              <td>
                ${formatDate(
                  row.exam_date
                )}
              </td>

              <td>
                ${escapeHtml(
                  row.exam_name || "-"
                )}
              </td>

              <td>
                ${escapeHtml(
                  row.subject || "-"
                )}
              </td>

              <td>
                <strong>
                  ${score}
                  /
                  ${total}
                </strong>
              </td>

              <td class="result-good">
                ${percentage.toFixed(2)}%
              </td>

            </tr>

          `;

        }).join("")}

      </tbody>

    </table>
  `;
}


/*
  ERROR
*/

function showError(message) {

  document.getElementById(
    "loading"
  ).style.display = "none";


  const box =
    document.getElementById(
      "errorBox"
    );


  box.style.display = "block";


  box.innerHTML = `

    <h2>❌ Rakkoo</h2>

    <p>
      ${escapeHtml(message)}
    </p>

    <p>
      Linkiin dhuunfaa barataa
      sirrii ta'uu isaa mirkaneessi.
    </p>

  `;
}


/*
  START
*/

loadStudent();

</script>

</body>
  </html>
