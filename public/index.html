<!DOCTYPE html>
<html lang="om">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta name="theme-color" content="#087443">

  <title>Walo-OR Attendance</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f3f7f5;
      color: #17352a;
    }

    button,
    input,
    select,
    textarea {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    .hidden {
      display: none !important;
    }

    .auth-page {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background:
        linear-gradient(
          135deg,
          #087443,
          #176b45
        );
    }

    .auth-card {
      width: 100%;
      max-width: 450px;
      background: white;
      border-radius: 20px;
      padding: 28px;
      box-shadow: 0 20px 50px rgba(0,0,0,.2);
    }

    .logo {
      text-align: center;
      font-size: 34px;
      font-weight: 800;
      color: #087443;
      margin-bottom: 5px;
    }

    .subtitle {
      text-align: center;
      color: #65756e;
      margin-bottom: 25px;
    }

    .tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 20px;
    }

    .tabs button {
      flex: 1;
      padding: 12px;
      border: 0;
      border-radius: 10px;
      background: #edf3f0;
      color: #176b45;
      font-weight: 700;
    }

    .tabs button.active {
      background: #087443;
      color: white;
    }

    .field {
      margin-bottom: 14px;
    }

    .field label {
      display: block;
      margin-bottom: 6px;
      font-weight: 700;
    }

    input,
    select,
    textarea {
      width: 100%;
      padding: 12px;
      border: 1px solid #d3dfd9;
      border-radius: 10px;
      outline: none;
      background: white;
    }

    input:focus,
    select:focus,
    textarea:focus {
      border-color: #087443;
    }

    .primary {
      width: 100%;
      border: 0;
      padding: 13px;
      border-radius: 10px;
      background: #087443;
      color: white;
      font-weight: 700;
    }

    .secondary {
      border: 1px solid #087443;
      padding: 10px 14px;
      border-radius: 10px;
      background: white;
      color: #087443;
      font-weight: 700;
    }

    .danger {
      border: 0;
      padding: 8px 12px;
      border-radius: 8px;
      background: #c62828;
      color: white;
    }

    .app {
      min-height: 100vh;
      display: flex;
    }

    .sidebar {
      width: 250px;
      background: #087443;
      color: white;
      padding: 20px;
      position: fixed;
      top: 0;
      bottom: 0;
      left: 0;
      overflow-y: auto;
    }

    .brand {
      font-size: 24px;
      font-weight: 800;
      margin-bottom: 25px;
    }

    .menu button {
      width: 100%;
      text-align: left;
      border: 0;
      background: transparent;
      color: white;
      padding: 13px;
      border-radius: 10px;
      margin-bottom: 5px;
      font-weight: 700;
    }

    .menu button:hover,
    .menu button.active {
      background: rgba(255,255,255,.15);
    }

    .logout {
      margin-top: 25px;
      width: 100%;
      padding: 12px;
      border: 0;
      border-radius: 10px;
      background: white;
      color: #087443;
      font-weight: 700;
    }

    .main {
      margin-left: 250px;
      width: calc(100% - 250px);
      padding: 25px;
    }

    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 15px;
      margin-bottom: 25px;
    }

    .topbar h1 {
      margin: 0;
      color: #087443;
    }

    .card {
      background: white;
      border-radius: 16px;
      padding: 20px;
      margin-bottom: 20px;
      box-shadow: 0 5px 20px rgba(0,0,0,.05);
    }

    .stats {
      display: grid;
      grid-template-columns:
        repeat(auto-fit,minmax(160px,1fr));
      gap: 15px;
      margin-bottom: 20px;
    }

    .stat {
      background: white;
      border-radius: 15px;
      padding: 20px;
      box-shadow: 0 5px 20px rgba(0,0,0,.05);
    }

    .stat-number {
      font-size: 30px;
      font-weight: 800;
      color: #087443;
    }

    .stat-title {
      color: #687870;
      margin-top: 5px;
    }

    .grid {
      display: grid;
      grid-template-columns:
        repeat(auto-fit,minmax(220px,1fr));
      gap: 15px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 15px;
    }

    th,
    td {
      padding: 12px;
      border-bottom: 1px solid #e4ebe7;
      text-align: left;
    }

    th {
      background: #edf6f1;
      color: #087443;
    }

    .badge {
      display: inline-block;
      padding: 5px 9px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 700;
    }

    .present {
      background: #d8f3e5;
      color: #087443;
    }

    .absent {
      background: #ffe0e0;
      color: #a52020;
    }

    .late {
      background: #fff1c9;
      color: #875e00;
    }

    .student-code {
      background: #edf6f1;
      border: 2px dashed #087443;
      padding: 15px;
      border-radius: 12px;
      font-size: 20px;
      font-weight: 800;
      color: #087443;
      text-align: center;
      margin-bottom: 20px;
    }

    .result-good {
      color: #087443;
      font-weight: 800;
    }

    .result-bad {
      color: #b3261e;
      font-weight: 800;
    }

    .message {
      padding: 12px;
      border-radius: 10px;
      margin-bottom: 15px;
      display: none;
    }

    .message.show {
      display: block;
    }

    .success {
      background: #dcf5e7;
      color: #087443;
    }

    .error {
      background: #ffe0e0;
      color: #a52020;
    }

    @media(max-width:800px) {
      .sidebar {
        width: 100%;
        height: auto;
        position: relative;
      }

      .app {
        display: block;
      }

      .main {
        margin-left: 0;
        width: 100%;
        padding: 15px;
      }

      .menu {
        display: grid;
        grid-template-columns:
          repeat(2,1fr);
        gap: 5px;
      }

      .logout {
        margin-top: 10px;
      }

      table {
        min-width: 700px;
      }

      .table-wrap {
        overflow-x: auto;
      }
    }
  </style>
</head>

<body>

<!-- ================= AUTH ================= -->

<div id="authPage" class="auth-page">

  <div class="auth-card">

    <div class="logo">
      🎯 Walo-OR
    </div>

    <div class="subtitle">
      Attendance fi Bu'aa Qormaataa
    </div>

    <div class="tabs">
      <button
        id="teacherTab"
        class="active"
        onclick="showTeacherAuth()"
      >
        👨‍🏫 Barsiisaa
      </button>

      <button
        id="studentTab"
        onclick="showStudentAuth()"
      >
        👨‍🎓 Barataa
      </button>
    </div>

    <div id="message" class="message"></div>

    <!-- TEACHER -->

    <div id="teacherAuth">

      <div id="registerBox">

        <div class="field">
          <label>Maqaa</label>
          <input
            id="registerName"
            placeholder="Maqaa kee"
          >
        </div>

        <div class="field">
          <label>Email</label>
          <input
            id="registerEmail"
            type="email"
            placeholder="Email"
          >
        </div>

        <div class="field">
          <label>Password</label>
          <input
            id="registerPassword"
            type="password"
            placeholder="Password"
          >
        </div>

        <button
          class="primary"
          onclick="registerTeacher()"
        >
          Account Uumi
        </button>

        <p style="text-align:center">
          Account qabdaa?
          <a href="#" onclick="showTeacherLogin()">
            Seeni
          </a>
        </p>

      </div>

      <div id="loginBox" class="hidden">

        <div class="field">
          <label>Email</label>
          <input
            id="loginEmail"
            type="email"
            placeholder="Email"
          >
        </div>

        <div class="field">
          <label>Password</label>
          <input
            id="loginPassword"
            type="password"
            placeholder="Password"
          >
        </div>

        <button
          class="primary"
          onclick="loginTeacher()"
        >
          Seeni
        </button>

        <p style="text-align:center">
          Account hin qabduu?
          <a href="#" onclick="showTeacherRegister()">
            Account uumi
          </a>
        </p>

      </div>

    </div>

    <!-- STUDENT -->

    <div id="studentAuth" class="hidden">

      <div class="field">
        <label>Koodii Barataa</label>

        <input
          id="studentCodeLogin"
          placeholder="Fakkeenya: WAL001"
        >
      </div>

      <button
        class="primary"
        onclick="loginStudent()"
      >
        Bu'aa Koo Ilaali
      </button>

      <p style="font-size:13px;color:#687870">
        Koodii kana barsiisaan kee siif kenna.
      </p>

    </div>

  </div>

</div>

<!-- ================= TEACHER APP ================= -->

<div id="teacherApp" class="app hidden">

  <aside class="sidebar">

    <div class="brand">
      🎯 Walo-OR
    </div>

    <div class="menu">

      <button onclick="teacherPage('dashboard')">
        🏠 Dashboard
      </button>

      <button onclick="teacherPage('classes')">
        🏫 Kutaa
      </button>

      <button onclick="teacherPage('students')">
        👨‍🎓 Barattoota
      </button>

      <button onclick="teacherPage('attendance')">
        📝 Attendance
      </button>

      <button onclick="teacherPage('report')">
        📊 Report
      </button>

      <button onclick="teacherPage('results')">
        🏆 Bu'aa Qormaataa
      </button>

    </div>

    <button
      class="logout"
      onclick="logoutTeacher()"
    >
      Ba'i
    </button>

  </aside>

  <main class="main">

    <div class="topbar">
      <h1 id="teacherTitle">
        Dashboard
      </h1>

      <strong id="teacherName"></strong>
    </div>

    <div id="teacherContent"></div>

  </main>

</div>

<!-- ================= STUDENT APP ================= -->

<div id="studentApp" class="app hidden">

  <aside class="sidebar">

    <div class="brand">
      🎯 Walo-OR
    </div>

    <div class="menu">

      <button onclick="studentPage('home')">
        🏠 Fuula Jalqabaa
      </button>

      <button onclick="studentPage('attendance')">
        📝 Attendance Koo
      </button>

      <button onclick="studentPage('results')">
        🏆 Bu'aa Qormaataa Koo
      </button>

    </div>

    <button
      class="logout"
      onclick="logoutStudent()"
    >
      Ba'i
    </button>

  </aside>

  <main class="main">

    <div class="topbar">
      <h1 id="studentTitle">
        Fuula Jalqabaa
      </h1>

      <strong id="studentName"></strong>
    </div>

    <div id="studentContent"></div>

  </main>

</div>

<script>
/* =========================
   GLOBAL
========================= */

const teacherTokenKey = "walo_teacher_token";
const studentTokenKey = "walo_student_token";

let teacherToken =
  localStorage.getItem(teacherTokenKey);

let studentToken =
  localStorage.getItem(studentTokenKey);

let teacherUser = null;
let studentUser = null;

/* =========================
   HELPERS
========================= */

function showMessage(text, type="success") {
  const box = document.getElementById("message");

  box.textContent = text;
  box.className =
    "message show " + type;

  setTimeout(() => {
    box.className = "message";
  }, 4000);
}

async function api(url, options={}) {

  options.headers = {
    "Content-Type": "application/json",
    ...(options.headers || {}),
    ...(teacherToken
      ? { Authorization: "Bearer " + teacherToken }
      : {})
  };

  const response =
    await fetch(url, options);

  const data =
    await response.json().catch(() => ({}));

  if (!response.ok) {
    throw new Error(
      data.error || "Request failed"
    );
  }

  return data;
}

async function studentApi(url, options={}) {

  options.headers = {
    "Content-Type": "application/json",
    ...(options.headers || {}),
    ...(studentToken
      ? { Authorization: "Bearer " + studentToken }
      : {})
  };

  const response =
    await fetch(url, options);

  const data =
    await response.json().catch(() => ({}));

  if (!response.ok) {
    throw new Error(
      data.error || "Request failed"
    );
  }

  return data;
}

/* =========================
   AUTH TABS
========================= */

function showTeacherAuth() {

  document
    .getElementById("teacherTab")
    .classList.add("active");

  document
    .getElementById("studentTab")
    .classList.remove("active");

  document
    .getElementById("teacherAuth")
    .classList.remove("hidden");

  document
    .getElementById("studentAuth")
    .classList.add("hidden");
}

function showStudentAuth() {

  document
    .getElementById("studentTab")
    .classList.add("active");

  document
    .getElementById("teacherTab")
    .classList.remove("active");

  document
    .getElementById("studentAuth")
    .classList.remove("hidden");

  document
    .getElementById("teacherAuth")
    .classList.add("hidden");
}

function showTeacherLogin() {
  document
    .getElementById("registerBox")
    .classList.add("hidden");

  document
    .getElementById("loginBox")
    .classList.remove("hidden");
}

function showTeacherRegister() {
  document
    .getElementById("loginBox")
    .classList.add("hidden");

  document
    .getElementById("registerBox")
    .classList.remove("hidden");
}

/* =========================
   TEACHER AUTH
========================= */

async function registerTeacher() {

  try {

    const data = await fetch(
      "/api/register",
      {
        method: "POST",
        headers: {
          "Content-Type":
            "application/json"
        },
        body: JSON.stringify({
          name:
            document.getElementById(
              "registerName"
            ).value,

          email:
            document.getElementById(
              "registerEmail"
            ).value,

          password:
            document.getElementById(
              "registerPassword"
            ).value
        })
      }
    );

    const result = await data.json();

    if (!data.ok) {
      throw new Error(
        result.error
      );
    }

    teacherToken = result.token;

    localStorage.setItem(
      teacherTokenKey,
      teacherToken
    );

    teacherUser = result.user;

    openTeacherApp();

  } catch (err) {
    showMessage(
      err.message,
      "error"
    );
  }
}

async function loginTeacher() {

  try {

    const response = await fetch(
      "/api/login",
      {
        method: "POST",
        headers: {
          "Content-Type":
            "application/json"
        },
        body: JSON.stringify({
          email:
            document.getElementById(
              "loginEmail"
            ).value,

          password:
            document.getElementById(
              "loginPassword"
            ).value
        })
      }
    );

    const data =
      await response.json();

    if (!response.ok) {
      throw new Error(
        data.error
      );
    }

    teacherToken = data.token;

    localStorage.setItem(
      teacherTokenKey,
      teacherToken
    );

    teacherUser = data.user;

    openTeacherApp();

  } catch (err) {
    showMessage(
      err.message,
      "error"
    );
  }
}

/* =========================
   STUDENT LOGIN
========================= */

async function loginStudent() {

  try {

    const code =
      document.getElementById(
        "studentCodeLogin"
      ).value.trim();

    if (!code) {
      throw new Error(
        "Koodii barataa galchi."
      );
    }

    const response = await fetch(
      "/api/student/login",
      {
        method: "POST",
        headers: {
          "Content-Type":
            "application/json"
        },
        body: JSON.stringify({
          studentCode: code
        })
      }
    );

    const data =
      await response.json();

    if (!response.ok) {
      throw new Error(
        data.error
      );
    }

    studentToken = data.token;

    localStorage.setItem(
      studentTokenKey,
      studentToken
    );

    studentUser = data.student;

    openStudentApp();

  } catch (err) {

    showMessage(
      err.message,
      "error"
    );
  }
}

/* =========================
   OPEN APPS
========================= */

function openTeacherApp() {

  document
    .getElementById("authPage")
    .classList.add("hidden");

  document
    .getElementById("studentApp")
    .classList.add("hidden");

  document
    .getElementById("teacherApp")
    .classList.remove("hidden");

  document.getElementById(
    "teacherName"
  ).textContent =
    teacherUser?.name || "";

  teacherPage("dashboard");
}

function openStudentApp() {

  document
    .getElementById("authPage")
    .classList.add("hidden");

  document
    .getElementById("teacherApp")
    .classList.add("hidden");

  document
    .getElementById("studentApp")
    .classList.remove("hidden");

  document.getElementById(
    "studentName"
  ).textContent =
    studentUser?.full_name || "";

  studentPage("home");
}

function logoutTeacher() {
  localStorage.removeItem(
    teacherTokenKey
  );

  location.reload();
}

function logoutStudent() {
  localStorage.removeItem(
    studentTokenKey
  );

  location.reload();
}

/* =========================
   TEACHER PAGES
========================= */

async function teacherPage(page) {

  const content =
    document.getElementById(
      "teacherContent"
    );

  const title =
    document.getElementById(
      "teacherTitle"
    );

  try {

    if (page === "dashboard") {

      title.textContent =
        "Dashboard";

      const d =
        await api("/api/dashboard");

      content.innerHTML = `
        <div class="stats">

          <div class="stat">
            <div class="stat-number">
              ${d.classes}
            </div>
            <div class="stat-title">
              Kutaa
            </div>
          </div>

          <div class="stat">
            <div class="stat-number">
              ${d.students}
            </div>
            <div class="stat-title">
              Barattoota
            </div>
          </div>

          <div class="stat">
            <div class="stat-number">
              ${d.present}
            </div>
            <div class="stat-title">
              Present
            </div>
          </div>

          <div class="stat">
            <div class="stat-number">
              ${d.absent}
            </div>
            <div class="stat-title">
              Absent
            </div>
          </div>

          <div class="stat">
            <div class="stat-number">
              ${d.results}
            </div>
            <div class="stat-title">
              Bu'aa Qormaataa
            </div>
          </div>

        </div>

        <div class="card">
          <h2>🎯 Walo-OR</h2>

          <p>
            Attendance fi bu'aa qormaataa
            barattootaa bulchi.
          </p>

          <button
            class="primary"
            onclick="teacherPage('results')"
          >
            🏆 Bu'aa Qormaataa Galchi
          </button>
        </div>
      `;

      return;
    }

    if (page === "classes") {

      title.textContent =
        "Kutaa";

      const classes =
        await api("/api/classes");

      content.innerHTML = `
        <div class="card">

          <h2>🏫 Kutaa Haaraa</h2>

          <div class="grid">

            <div class="field">
              <label>Maqaa Kutaa</label>
              <input
                id="className"
                placeholder="Fakkeenya: Qur'anul-Karim"
              >
            </div>

            <div class="field">
              <label>Sadarkaa</label>
              <input
                id="classGrade"
                placeholder="Fakkeenya: Grade 8"
              >
            </div>

          </div>

          <button
            class="primary"
            onclick="addClass()"
          >
            Kutaa Uumi
          </button>

        </div>

        <div class="card">
          <h2>Kutaawwan</h2>

          <div class="table-wrap">
            <table>

              <thead>
                <tr>
                  <th>Maqaa</th>
                  <th>Sadarkaa</th>
                  <th>Barattoota</th>
                  <th></th>
                </tr>
              </thead>

              <tbody>

                ${classes.map(c => `
                  <tr>
                    <td>${escapeHtml(c.name)}</td>
                    <td>${escapeHtml(c.grade || "")}</td>
                    <td>${c.student_count}</td>
                    <td>
                      <button
                        class="danger"
                        onclick="deleteClass(${c.id})"
                      >
                        Haqi
                      </button>
                    </td>
                  </tr>
                `).join("")}

              </tbody>

            </table>
          </div>

        </div>
      `;

      return;
    }

    if (page === "students") {

      title.textContent =
        "Barattoota";

      const classes =
        await api("/api/classes");

      const students =
        await api("/api/students");

      content.innerHTML = `
        <div class="card">

          <h2>👨‍🎓 Barataa Galchi</h2>

          <div class="grid">

            <div class="field">
              <label>Maqaa Guutuu</label>
              <input
                id="studentNameInput"
                placeholder="Maqaa barataa"
              >
            </div>

            <div class="field">
              <label>Koodii Addaa</label>
              <input
                id="studentCodeInput"
                placeholder="Fakkeenya: WAL001"
              >
            </div>

            <div class="field">
              <label>Bilbila</label>
              <input
                id="studentPhoneInput"
                placeholder="Bilbila"
              >
            </div>

            <div class="field">
              <label>Kutaa</label>

              <select id="studentClassInput">

                <option value="">
                  Kutaa filadhu
                </option>

                ${classes.map(c => `
                  <option value="${c.id}">
                    ${escapeHtml(c.name)}
                  </option>
                `).join("")}

              </select>

            </div>

          </div>

          <button
            class="primary"
            onclick="addStudent()"
          >
            Barataa Galchi
          </button>

        </div>

        <div class="card">

          <h2>Barattoota</h2>

          <div class="table-wrap">

            <table>

              <thead>
                <tr>
                  <th>Maqaa</th>
                  <th>Koodii</th>
                  <th>Kutaa</th>
                  <th></th>
                </tr>
              </thead>

              <tbody>

                ${students.map(s => `
                  <tr>
                    <td>${escapeHtml(s.full_name)}</td>
                    <td>
                      <strong>
                        ${escapeHtml(s.student_code)}
                      </strong>
                    </td>
                    <td>${escapeHtml(s.class_name || "")}</td>
                    <td>
                      <button
                        class="danger"

async function loadAttendanceStudents() {

  const classId =
    document.getElementById(
      "attendanceClass"
    ).value;

  const box =
    document.getElementById(
      "attendanceStudents"
    );

  if (!classId) {
    box.innerHTML = "";
    return;
  }

  try {

    const students =
      await api(
        "/api/students?classId=" +
        encodeURIComponent(classId)
      );

    box.innerHTML = `
      <div class="table-wrap">

        <table>

          <thead>
            <tr>
              <th>Barataa</th>
              <th>Koodii</th>
              <th>Status</th>
              <th>Yaada</th>
              <th></th>
            </tr>
          </thead>

          <tbody>

            ${students.map(s => `
              <tr>

                <td>
                  ${escapeHtml(s.full_name)}
                </td>

                <td>
                  ${escapeHtml(s.student_code)}
                </td>

                <td>
                  <select
                    id="status-${s.id}"
                  >
                    <option value="present">
                      Present
                    </option>

                    <option value="absent">
                      Absent
                    </option>

                    <option value="late">
                      Late
                    </option>
                  </select>
                </td>

                <td>
                  <input
                    id="note-${s.id}"
                    placeholder="Yaada"
                  >
                </td>

                <td>
                  <button
                    class="secondary"
                    onclick="saveAttendance(${s.id},${classId})"
                  >
                    Galchi
                  </button>
                </td>

              </tr>
            `).join("")}

          </tbody>

        </table>

      </div>
    `;

  } catch (err) {
    alert(err.message);
  }
}

async function saveAttendance(
  studentId,
  classId
) {

  try {

    const date =
      document.getElementById(
        "attendanceDate"
      ).value;

    const status =
      document.getElementById(
        "status-" + studentId
      ).value;

    const note =
      document.getElementById(
        "note-" + studentId
      ).value;

    await api(
      "/api/attendance",
      {
        method: "POST",
        body: JSON.stringify({
          studentId,
          classId,
          attendanceDate: date,
          status,
          note
        })
      }
    );

    alert("Attendance galmaa'e.");

  } catch (err) {
    alert(err.message);
  }
}

async function studentPage(page) {

  const content =

      "studentContent"

  const title =
    document.getElementById(
      "studentTitle"
    );

  try {

      title.textContent =

      if (!studentUser) {
        studentUser =
          await studentApi(
            "/api/student/me"
          );
      }

      content.innerHTML = `
        <div class="card">

          <div class="student-code">
            🔑 Koodii Kee:
            ${escapeHtml(
              studentUser.student_code
            )}
          </div>

          <h2>
            Baga Nagaan Dhufte,
            ${escapeHtml(
              studentUser.full_name
            )}
          </h2>

          <p>
            Kutaa:
            <strong>
              ${escapeHtml(
                studentUser.class_name || "-"
              )}
            </strong>
          </p>

          <p>
            Sadarkaa:
            <strong>
              ${escapeHtml(
                studentUser.grade || "-"
              )}
            </strong>
          </p>

          <button
            class="primary"
            onclick="studentPage('results')"
          >
            🏆 Bu'aa Qormaataa Koo Ilaali
          </button>

        </div>
      `;

      return;
    }

    if (page === "attendance") {

      title.textContent =
        "Attendance Koo";

      const attendance =
        await studentApi(
          "/api/student/attendance"
        );

      content.innerHTML = `
        <div class="card">

          <h2>📝 Attendance Koo</h2>

          <div class="table-wrap">

            <table>

              <thead>
                <tr>
                  <th>Guyyaa</th>
                  <th>Status</th>
                  <th>Yaada</th>
                </tr>
              </thead>

              <tbody>

                ${attendance.map(a => `

                  <tr>

                    <td>
                      ${escapeHtml(
                        String(
                          a.attendance_date
                        ).slice(0,10)
                      )}
                    </td>

                    <td>

                      <span
                        class="badge ${
                          a.status === "present"
                            ? "present"
                            : a.status === "absent"
                            ? "absent"
                            : "late"
                        }"
                      >
                        ${escapeHtml(
                          a.status
                        )}
                      </span>

                    </td>

                    <td>
                      ${escapeHtml(
                        a.note || ""
                      )}
                    </td>

                  </tr>

                `).join("")}

              </tbody>

            </table>

          </div>

        </div>
      `;

      return;
    }

    if (page === "results") {

      title.textContent =
        "Bu'aa Qormaataa Koo";

      const results =
        await studentApi(
          "/api/student/results"
        );

      let average = 0;

      if (results.length) {

        average =
          results.reduce(
            (sum, r) =>
              sum + Number(r.percentage),
            0
          ) / results.length;
      }

      content.innerHTML = `
        <div class="card">

          <div class="student-code">
            🔑 Koodii Kee:
            ${escapeHtml(
              studentUser.student_code
            )}
          </div>

          <h2>
            🏆 Bu'aa Qormaataa Koo
          </h2>

          <div class="stats">

            <div class="stat">
              <div class="stat-number">
                ${results.length}
              </div>
              <div class="stat-title">
                Qormaata
              </div>
            </div>

            <div class="stat">
              <div class="stat-number">
                ${average.toFixed(2)}%
              </div>
              <div class="stat-title">
                Giddugaleessa
              </div>
            </div>

          </div>

          ${
            results.length
              ? `
              <div class="table-wrap">

                <table>

                  <thead>
                    <tr>
                      <th>Qormaata</th>
                      <th>Barnoota</th>
                      <th>Qabxii</th>
                      <th>Percentage</th>
                      <th>Guyyaa</th>
                      <th>Yaada</th>
                    </tr>
                  </thead>

                  <tbody>

                    ${results.map(r => {

                      const percent =
                        Number(
                          r.percentage
                        );

                      return `
                        <tr>

                          <td>
                            ${escapeHtml(
                              r.exam_name
                            )}
                          </td>

                          <td>
                            ${escapeHtml(
                              r.subject || ""
                            )}
                          </td>

                          <td>
                            <strong>
                              ${r.score}
                              /
                              ${r.total}
                            </strong>
                          </td>

                          <td>
                            <span
                              class="${
                                percent >= 50
                                  ? "result-good"
                                  : "result-bad"
                              }"
                            >
                              ${percent}%
                            </span>
                          </td>

                          <td>
                            ${escapeHtml(
                              String(
                                r.exam_date
                              ).slice(0,10)
                            )}
                          </td>

                          <td>
                            ${escapeHtml(
                              r.note || ""
                            )}
                          </td>

                        </tr>
                      `;

                    }).join("")}

                  </tbody>

                </table>

              </div>
              `
              : `
                <div class="card">
                  <p>
                    Ammaaf bu'aan qormaataa
                    siif hin galmoofne.
                  </p>
                </div>
              `
          }

        </div>
      `;

      return;
    }

  } catch (err) {

    content.innerHTML = `
      <div class="card">
        <div class="message show error">
          ${escapeHtml(err.message)}
        </div>
      </div>
    `;
  }
}

/* =========================
   UTILS
========================= */

function today() {
  return new Date()
    .toISOString()
    .slice(0, 10);
}

function escapeHtml(value) {

  return String(value ?? "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");
}
