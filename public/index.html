<!DOCTYPE html>
<html lang="om">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Walo-OR - Barataa</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family:
        Arial,
        Helvetica,
        sans-serif;

      background: #f4f7f5;
      color: #17231c;
    }

    .header {
      background: #087443;
      color: white;
      padding: 18px;
      text-align: center;
    }

    .header h1 {
      margin: 0;
      font-size: 22px;
    }

    .header p {
      margin: 7px 0 0;
      opacity: .9;
    }

    .container {
      width: min(1000px, 94%);
      margin: 20px auto;
    }

    .profile {
      background: white;
      border-radius: 16px;
      padding: 20px;
      margin-bottom: 18px;
      box-shadow:
        0 4px 15px rgba(0,0,0,.07);
    }

    .profile h2 {
      margin-top: 0;
      color: #087443;
    }

    .grid {
      display: grid;
      grid-template-columns:
        repeat(auto-fit, minmax(160px, 1fr));
      gap: 12px;
    }

    .stat {
      background: #eef8f2;
      border-radius: 14px;
      padding: 16px;
      text-align: center;
    }

    .stat strong {
      display: block;
      font-size: 25px;
      color: #087443;
      margin-top: 5px;
    }

    .card {
      background: white;
      border-radius: 16px;
      padding: 20px;
      margin-bottom: 18px;
      box-shadow:
        0 4px 15px rgba(0,0,0,.07);
      overflow-x: auto;
    }

    .card h2 {
      margin-top: 0;
      color: #087443;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 500px;
    }

    th,
    td {
      padding: 12px;
      border-bottom: 1px solid #e5e5e5;
      text-align: left;
    }

    th {
      background: #087443;
      color: white;
    }

    .present {
      color: #087443;
      font-weight: bold;
    }

    .absent {
      color: #c62828;
      font-weight: bold;
    }

    .late {
      color: #c47a00;
      font-weight: bold;
    }

    .result-good {
      color: #087443;
      font-weight: bold;
    }

    .loading {
      text-align: center;
      padding: 50px 15px;
      font-size: 18px;
    }

    .error {
      max-width: 600px;
      margin: 60px auto;
      background: white;
      padding: 30px;
      border-radius: 16px;
      text-align: center;
      box-shadow:
        0 4px 20px rgba(0,0,0,.08);
    }

    .error h2 {
      color: #c62828;
    }

    .footer {
      text-align: center;
      color: #777;
      padding: 25px;
    }

    .code {
      display: inline-block;
      background: #eef8f2;
      color: #087443;
      padding: 6px 10px;
      border-radius: 8px;
      font-weight: bold;
    }
  </style>
</head>

<body>

  <header class="header">
    <h1>🎓 Walo-OR</h1>
    <p>Attendance fi Bu'aa Qormaataa</p>
  </header>

  <main class="container">

    <div id="loading" class="loading">
      ⏳ Odeeffannoo kee fe'aa jira...
    </div>

    <div id="errorBox"
         class="error"
         style="display:none;">
    </div>

    <div id="content"
         style="display:none;">

      <!-- PROFILE -->
      <section class="profile">

        <h2 id="studentName">
          👤 Barataa
        </h2>

        <p>
          Koodii:
          <span
            id="studentCode"
            class="code">
          </span>
        </p>

        <p>
          Kutaa:
          <strong id="className"></strong>
        </p>

        <p>
          Sadarkaa:
          <strong id="grade"></strong>
        </p>

      </section>

      <!-- ATTENDANCE SUMMARY -->
      <section class="card">

        <h2>📅 Attendance Koo</h2>

        <div class="grid">

          <div class="stat">
            Guutuu
            <strong id="attTotal">0</strong>
          </div>

          <div class="stat">
            🟢 Present
            <strong id="attPresent">0</strong>
          </div>

          <div class="stat">
            🔴 Absent
            <strong id="attAbsent">0</strong>
          </div>

          <div class="stat">
            🟡 Late
            <strong id="attLate">0</strong>
          </div>

        </div>

      </section>

      <!-- ATTENDANCE TABLE -->
      <section class="card">

        <h2>📋 Galmee Attendance</h2>

        <div id="attendanceTable">
        </div>

      </section>

      <!-- RESULTS -->
      <section class="card">

        <h2>🏆 Bu'aa Qormaataa Koo</h2>

        <div id="resultsTable">
        </div>

      </section>

    </div>

  </main>

  <footer class="footer">
    © 2026 Walo-OR
  </footer>

<script>

function escapeHtml(value) {
  return String(value ?? "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");
}

function getToken() {
  const path =
    window.location.pathname;

  const parts =
    path.split("/").filter(Boolean);

  if (
    parts.length >= 2 &&
    parts[0] === "s"
  ) {
    return parts[1];
  }

  return "";
}

function formatDate(date) {
  if (!date) return "-";

  const d =
    new Date(date);

  if (isNaN(d.getTime())) {
    return escapeHtml(date);
  }

  return d.toLocaleDateString(
    "om-ET"
  );
}

function statusText(status) {

  if (status === "present") {
    return "🟢 Present";
  }

  if (status === "absent") {
    return "🔴 Absent";
  }

  if (status === "late") {
    return "🟡 Late";
  }

  return "-";
}

function statusClass(status) {

  if (
    [
      "present",
      "absent",
      "late"
    ].includes(status)
  ) {
    return status;
  }

  return "";
}

async function loadStudent() {

  const token =
    getToken();

  if (!token) {
    showError(
      "Linkii barataa hin argamne."
    );
    return;
  }

  try {

    const response =
      await fetch(
        `/api/public/student/${encodeURIComponent(token)}`
      );

    const data =
      await response.json();

    if (!response.ok) {
      throw new Error(
        data.error ||
        "Odeeffannoo argachuu hin dandeenye."
      );
    }

    showStudent(data);

  } catch (error) {

    console.error(error);

    showError(
      error.message ||
      "Rakkoon uumameera."
    );
  }
}

function showStudent(data) {

  const student =
    data.student || {};

  const attendance =
    Array.isArray(data.attendance)
      ? data.attendance
      : [];

  const summary =
    data.attendanceSummary || {};

  const results =
    Array.isArray(data.results)
      ? data.results
      : [];

  document.getElementById(
    "studentName"
  ).textContent =
    `👤 ${student.full_name || "Barataa"}`;

  document.getElementById(
    "studentCode"
  ).textContent =
    student.student_code || "-";

  document.getElementById(
    "className"
  ).textContent =
    student.class_name || "-";

  document.getElementById(
    "grade"
  ).textContent =
    student.grade || "-";

  document.getElementById(
    "attTotal"
  ).textContent =
    summary.total || 0;

  document.getElementById(
    "attPresent"
  ).textContent =
    summary.present || 0;

  document.getElementById(
    "attAbsent"
  ).textContent =
    summary.absent || 0;

  document.getElementById(
    "attLate"
  ).textContent =
    summary.late || 0;

  renderAttendance(
    attendance
  );

  renderResults(
    results
  );

  document.getElementById(
    "loading"
  ).style.display = "none";

  document.getElementById(
    "content"
  ).style.display = "block";
}

function renderAttendance(rows) {

  const box =
    document.getElementById(
      "attendanceTable"
    );

  if (!rows.length) {
    box.innerHTML = `
      <p>
        📭 Attendance galmaa'ame
        hin jiru.
      </p>
    `;
    return;
  }

  box.innerHTML = `
    <table>
      <thead>
        <tr>
          <th>Guyyaa</th>
          <th>Haala</th>
          <th>Yaada</th>
        </tr>
      </thead>

      <tbody>

        ${rows.map(row => `
          <tr>

            <td>
              ${formatDate(
                row.attendance_date
              )}
            </td>

            <td class="${statusClass(
              row.status
            )}">
              ${statusText(
                row.status
              )}
            </td>

            <td>
              ${escapeHtml(
                row.note || "-"
              )}
            </td>

          </tr>
        `).join("")}

      </tbody>
    </table>
  `;
}

function renderResults(rows) {

  const box =
    document.getElementById(
      "resultsTable"
    );

  if (!rows.length) {
    box.innerHTML = `
      <p>
        📭 Bu'aan qormaataa
        ammaaf hin galmoofne.
      </p>
    `;
    return;
  }

  box.innerHTML = `
    <table>

      <thead>
        <tr>
          <th>Guyyaa</th>
          <th>Qormaata</th>
          <th>Mata-duree</th>
          <th>Qabxii</th>
          <th>%</th>
        </tr>
      </thead>

      <tbody>

        ${rows.map(row => {

          const percentage =
            Number(
              row.percentage || 0
            );

          return `
            <tr>

              <td>
                ${formatDate(
                  row.exam_date
                )}
              </td>

              <td>
                ${escapeHtml(
                  row.exam_name
                )}
              </td>

              <td>
                ${escapeHtml(
                  row.subject || "-"
                )}
              </td>

              <td>
                <strong>
                  ${row.score}
                  /
                  ${row.total}
                </strong>
              </td>

              <td class="result-good">
                ${percentage.toFixed(2)}%
              </td>

            </tr>
          `;

        }).join("")}

      </tbody>

    </table>
  `;
}

function showError(message) {

  document.getElementById(
    "loading"
  ).style.display = "none";

  const box =
    document.getElementById(
      "errorBox"
    );

  box.style.display = "block";

  box.innerHTML = `
    <h2>❌ Rakkoo</h2>

    <p>
      ${escapeHtml(message)}
    </p>

    <p>
      Linkiin kun sirrii ta'uu isaa
      mirkaneessi.
    </p>
  `;
}

loadStudent();

</script>

</body>
        </html>
